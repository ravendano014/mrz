<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Detección por Cámara o Imagen — idslv-0mjeo v6</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.20/lodash.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/async/3.2.0/async.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/inferencejs@1.1.3"></script>

<style>
/* ====== Dark theme base ====== */
:root {
  color-scheme: dark;
}
html, body {
  margin: 0;
  padding: 0;
  background: #0b0f14;
  color: #e5e7eb;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji';
}
.header {
  position: sticky;
  top: 0;
  background: #0f172a;
  border-bottom: 1px solid #1f2937;
  padding: 10px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  z-index: 10;
}
.header h1 {
  font-size: 16px;
  margin: 0 8px 0 0;
  color: #cbd5e1;
  font-weight: 600;
}
.header .spacer { flex: 1; }
.button {
  background: #111827;
  border: 1px solid #374151;
  color: #e5e7eb;
  padding: 8px 10px;
  border-radius: 10px;
  cursor: pointer;
}
.button:hover { background: #1f2937; }
/* Estilo para deshabilitado (opcional, para feedback visual) */
.button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
input[type="file"] {
  display: inline-block;
  padding: 6px 8px;
  background: #0b1220;
  border: 1px solid #334155;
  border-radius: 10px;
}
.select {
  background: #0b1220;
  color: #e5e7eb;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 6px 8px;
}
.main {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  padding: 12px;
}
.preview-wrap {
  position: relative;
  width: min(95vw, 900px);
  margin: 0 auto;
  border: 1px solid #1f2937;
  border-radius: 16px;
  overflow: hidden;
  background: #0b1220;
}
video, canvas, img#uploaded { display: block; width: 100%; height: auto; }
#uploaded { display: none; }
#fps {
  position: absolute;
  top: 10px; left: 10px;
  background: rgba(0,0,0,.6);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 12px;
  border: 1px solid #334155;
}
.badge {
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid #334155;
  border-radius: 999px;
  background: #0b1220;
}

/* ====== Original sample CSS (subset) ====== */
/* Se mantiene el CSS original para la experiencia de carga del modelo */
html,
body {
    background-color: black;
    color: white;
    font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans",
        sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
}

body video {
    transition: filter 250ms linear;
}

body.loading video {
    filter: grayscale(1) brightness(0.25);
}

body.loading:before {
    content: "Loading Model...";
    color: white;
    text-align: center;
    width: 100%;
    position: absolute;
    top: 20px;
    font-size: 3em;
    font-weight: bold;
    z-index: 100;
}
/* Aseguramos que la cámara esté oculta por defecto hasta que se inicie */
video {
    display: none; 
}

html,
body,
video,
canvas {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

/* Ajustamos el posicionamiento absoluto/fijo para el nuevo layout */
video,
canvas {
    position: absolute; 
    top: 0;
    left: 0;
}

body:after {
    content: "";
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 350px;
    height: 150px;
    z-index: 1;
    background-image: url("https://uploads-ssl.webflow.com/5eca8e43c4dfff837f0f6392/5ecad58e650fb5ec53e8b811_roboflow_assets_logo_white.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: bottom right;
}

#fps {
    position: absolute; /* Cambiado de fixed a absolute para estar dentro de preview-wrap */
    bottom: unset; /* Desactivar bottom: 10px */
    left: 10px;
    top: 10px;
    z-index: 20;
}

#fps:empty {
    display: none;
}

#fps:after {
    content: " fps";
}

</style>
</head>
<body class="loading">
  <div class="header">
    <h1>Detección (Cámara / Imagen)</h1>
    <span class="badge">Modelo: idslv-0mjeo · v6</span>
    <div class="spacer"></div>
    <select id="cameraMode" class="select" title="Cámara">
      <option value="environment">Cámara trasera</option>
      <option value="user">Cámara frontal</option>
    </select>
    <button id="btnStart" class="button">Iniciar cámara</button>
    <button id="btnStop" class="button">Detener cámara</button>
    <input id="fileInput" type="file" accept="image/*" />
    <button id="btnDetectImage" class="button">Detectar en imagen</button>
  </div>

  <div class="main">
    <div class="preview-wrap">
      <video id="video" autoplay muted playsinline></video>
      <img id="uploaded" alt="Imagen cargada" />
      <div id="fps">0</div>
      </div>
  </div>

<script>
/* ====== Código base del adjunto (adaptado y modificado para no iniciar cámara) ====== */

// Universal starter that tries multiple known signatures for InferenceJS
async function startWorkerCompat(engine, MODEL_ID, VERSION, API_KEY) {
  const attempts = [
    () => engine.startWorker(MODEL_ID, VERSION, API_KEY),
    () => engine.startWorker?.({ model: MODEL_ID, version: VERSION, apiKey: API_KEY }),
    () => engine.startWorker?.(`${MODEL_ID}/${VERSION}`, API_KEY),
    () => engine.startWorker?.({ modelId: MODEL_ID, modelVersion: VERSION, apiKey: API_KEY }),
    () => engine.startWorker?.({ id: MODEL_ID, version: VERSION, apiKey: API_KEY }),
  ];

  const errors = [];
  for (const makeCall of attempts) {
    try {
      const id = await makeCall();
      if (id != null) return id;
    } catch (e) {
      errors.push(e);
      // If error mentions spread/iterator, keep trying next signature
      continue;
    }
  }
  // Nothing worked; throw the last error for visibility
  const err = errors.length ? errors[errors.length - 1] : new Error("No compatible startWorker signature");
  throw err;
}


// Probe for WebGL2 availability
function hasWebGL2() {
  try {
    const c = document.createElement('canvas');
    const gl2 = c.getContext('webgl2', { antialias: false, preserveDrawingBuffer: false });
    return !!gl2;
  } catch (e) {
    return false;
  }
}

/*jshint esversion:6*/

$(function () {
    const { InferenceEngine } = inferencejs;
    // Hacemos inferEngine global para las extensiones
    window.inferEngine = new InferenceEngine(); 
    
    const video = $("#video")[0];

    var workerId;
    // Hacemos workerId global para las extensiones
    window.workerId = workerId; 
    
    // Eliminamos startVideoStreamPromise para evitar el inicio automático.

    const loadModelPromise = new Promise(function (resolve, reject) {
        (async () => {
            try {
                if (!hasWebGL2()) {
                    throw new Error("WebGL2 is not available. Trying non-GPU fallback…");
                }
                const id = await startWorkerCompat(inferEngine, "idslv-0mjeo", "6", "rf_hHUmNcZwoGhdPO3kyAlI6YY4R4m2");
                workerId = id;
                window.workerId = id;
                resolve();
            } catch (eWebgl) {
                console.warn("[inference] GPU path failed, trying WASM/CPU fallback…", eWebgl);
                try {
                    if (typeof inferEngine.startWorkerWasm === "function") {
                        const id2 = await inferEngine.startWorkerWasm("idslv-0mjeo", "6", "rf_hHUmNcZwoGhdPO3kyAlI6YY4R4m2");
                        workerId = id2;
                        window.workerId = id2;
                        resolve();
                    } else if (typeof inferEngine.startWorkerCpu === "function") {
                        const id3 = await inferEngine.startWorkerCpu("idslv-0mjeo", "6", "rf_hHUmNcZwoGhdPO3kyAlI6YY4R4m2");
                        workerId = id3;
                        window.workerId = id3;
                        resolve();
                    } else {
                        // Try a non-GPU start with the same compat shim (some builds auto-select backend)
                        const id4 = await startWorkerCompat(inferEngine, "idslv-0mjeo", "6", "rf_hHUmNcZwoGhdPO3kyAlI6YY4R4m2");
                        workerId = id4;
                        window.workerId = id4;
                        resolve();
                    }
                } catch (eFallback) {
                    reject(eFallback);
                }
            }
        })();
    });

    // Solo esperamos la carga del modelo.
    loadModelPromise.then(function () {
        $("body").removeClass("loading");
        
        // Habilitar el botón de detección de imagen una vez que el modelo esté cargado
        $("#btnDetectImage").prop("disabled", false); 
        console.log("Modelo de inferencia cargado. Listo para detección.");
        
    }).catch(function(e) {
        console.error("Error al cargar el modelo:", e);
    });
    
    // Deshabilitar detección de imagen hasta que el modelo esté listo
    $("#btnDetectImage").prop("disabled", true);


    // Secciones para Canvas y Detección (mantienen su función, solo se llaman de forma diferente)
    var canvas, ctx;
    const font = "16px sans-serif";
    
    function videoDimensions(video) {
        // Ratio of the video's intrisic dimensions
        var videoRatio = video.videoWidth / video.videoHeight;
        // The width and height of the video element
        var width = video.offsetWidth,
            height = video.offsetHeight;
        // The ratio of the element's width to its height
        var elementRatio = width / height;

        // If the video element is short and wide
        if (elementRatio > videoRatio) {
            width = height * videoRatio;
        } else {
            // It must be tall and thin, or exactly equal to the original ratio
            height = width / videoRatio;
        }
        return { width: width, height: height };
    }

    $(window).resize(function () {
        // Solo redimensionar si el video está visible (cámara activa)
        if ($("#video").is(":visible") && video.srcObject) {
            resizeCanvas();
        }
    });

    // Hacemos global para las extensiones
    window.resizeCanvas = function () { 
        $("canvas").remove();
        canvas = $("<canvas/>");
        ctx = canvas[0].getContext("2d");

        var dimensions = videoDimensions(video);
        
        canvas[0].width = video.videoWidth;
        canvas[0].height = video.videoHeight;

        canvas.css({
            width: dimensions.width,
            height: dimensions.height,
            // Ajuste de posicionamiento relativo al preview-wrap
            left: ($(".preview-wrap").width() - dimensions.width) / 2, 
            top: ($(".preview-wrap").height() - dimensions.height) / 2
        });

        $(".preview-wrap").append(canvas); // Insertar dentro de preview-wrap
    };

    const renderPredictions = function (predictions) { 
        var scale = 1;

        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

        predictions.forEach(function (prediction) {
            const x = prediction.bbox.x;
            const y = prediction.bbox.y;

            const width = prediction.bbox.width;
            const height = prediction.bbox.height;

            // Draw the bounding box.
            ctx.strokeStyle = prediction.color;
            ctx.lineWidth = 4;
            ctx.strokeRect(
                (x - width / 2) / scale,
                (y - height / 2) / scale,
                width / scale,
                height / scale
            );

            // Draw the label background.
            ctx.fillStyle = prediction.color;
            const textWidth = ctx.measureText(prediction.class).width;
            const textHeight = parseInt(font, 10); // base 10
            ctx.fillRect(
                (x - width / 2) / scale,
                (y - height / 2) / scale,
                textWidth + 8,
                textHeight + 4
            );
        });

        predictions.forEach(function (prediction) {
            const x = prediction.bbox.x;
            const y = prediction.bbox.y;

            const width = prediction.bbox.width;
            const height = prediction.bbox.height;

            // Draw the text last to ensure it's on top.
            ctx.font = font;
            ctx.textBaseline = "top";
            ctx.fillStyle = "#000000";
            ctx.fillText(
                prediction.class,
                (x - width / 2) / scale + 4,
                (y - height / 2) / scale + 1
            );
        });
    };

    var prevTime;
    var pastFrameTimes = [];
    // Bandera para controlar el loop de detección
    window.detecting = false; 
    
    // Hacemos global para poder llamarlo desde startCamera
    window.detectFrame = function () { 
        if (!workerId || !window.detecting) {
             return requestAnimationFrame(detectFrame);
        }

        const image = video;
        inferEngine
            .infer(workerId, image)
            .then(function (predictions) {
                requestAnimationFrame(detectFrame);
                renderPredictions(predictions);

                if (prevTime) {
                    pastFrameTimes.push(Date.now() - prevTime);
                    if (pastFrameTimes.length > 30) pastFrameTimes.shift();

                    var total = 0;
                    _.each(pastFrameTimes, function (t) {
                        total += t / 1000;
                    });

                    var fps = pastFrameTimes.length / total;
                    $("#fps").text(Math.round(fps));
                }
                prevTime = Date.now();
            })
            .catch(function (e) {
                console.log("CAUGHT", e);
                // Si hay un error, intentamos seguir el loop
                requestAnimationFrame(detectFrame);
            });
    };
});


/* ====== Extensiones para subir imagen y detectar (Ajustadas para globals) ====== */
(function(){
  const $video = $("#video")[0];
  const $img   = $("#uploaded")[0];
  const $wrap  = $(".preview-wrap");
  let imgCanvas = null, imgCtx = null;
  let stream = null;

  // Utilidades para dibujar predicciones sobre un canvas arbitrario
  function drawPredictionsOn(ctx, predictions) {
    if (!predictions) return;
    ctx.lineWidth = 4;
    predictions.forEach(p => {
      const x = p.bbox.x, y = p.bbox.y, w = p.bbox.width, h = p.bbox.height;
      ctx.strokeStyle = p.color || "#22d3ee";
      ctx.strokeRect(x - w/2, y - h/2, w, h);

      const label = p.class + (p.confidence ? (" " + (p.confidence*100).toFixed(1) + "%") : "");
      const font = "16px sans-serif";
      ctx.font = font;
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = p.color || "#22d3ee";
      ctx.fillRect(x - w/2, y - h/2 - 18, tw + 8, 18);
      ctx.fillStyle = "#000";
      ctx.fillText(label, x - w/2 + 4, y - h/2 - 16 + 14);
    });
  }

  // Función para detectar sobre una imagen subida
  async function detectOnImageElement(img) {
    // detener cámara si está activa
    stopCamera();
    
    // Eliminar canvas de video si existe
    $(".preview-wrap canvas").remove();

    // preparar canvas del tamaño de la imagen
    if (imgCanvas) imgCanvas.remove();
    imgCanvas = document.createElement("canvas");
    imgCanvas.width  = img.naturalWidth;
    imgCanvas.height = img.naturalHeight;
    imgCanvas.style.width = "100%";
    imgCanvas.style.height = "auto";
    imgCtx = imgCanvas.getContext("2d");
    imgCtx.drawImage(img, 0, 0);

    // insertar canvas en la UI (sobre la vista previa)
    $wrap.append(imgCanvas);

    // crear CVImage desde el canvas y ejecutar inferencia
    const imageInput = imgCanvas;
    try {
      // Usamos las variables globales
      if (!window.workerId || !window.inferEngine) {
        console.warn("Modelo aún no cargado...");
        return;
      }
      const _bm = await makeBitmapFrom(imageInput);
      const preds = await inferEngine.infer(window.workerId, _bm || imageInput);
      if (_bm && _bm.close) { try { _bm.close(); } catch(_){} }
      // volver a dibujar la imagen (limpia)
      imgCtx.drawImage(img, 0, 0);
      drawPredictionsOn(imgCtx, preds);
    } catch (err) {
      console.error("Error en detección de imagen:", err);
    }
  }

  // Cargar imagen desde input
  $("#fileInput").on("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    $img.onload = () => {
      $img.style.display = "block";
      $video.style.display = "none";
      $("#fps").text("0"); // Limpiar FPS
    };
    $img.src = url;
  });

  // Botón "Detectar en imagen"
  $("#btnDetectImage").on("click", () => {
    if ($img.src) detectOnImageElement($img);
  });

  // Controles de cámara
  async function startCamera() {
    if (!window.workerId) {
        alert("El modelo aún se está cargando. Por favor, espera un momento.");
        return;
    }
    try {
      // detener detección de imagen
      if (imgCanvas) imgCanvas.remove();
      
      const facingMode = $("#cameraMode").val();
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode } });
      $video.srcObject = stream;
      
      // Esperar a que el video esté listo para la detección y el canvas
      $video.onloadeddata = function() {
          $video.play();
          $video.style.display = "block";
          $img.style.display = "none";
          
          // forzar redibujado de canvas del demo original
          if (typeof resizeCanvas === "function") window.resizeCanvas();

          // Iniciar el ciclo de detección
          window.detecting = true;
          window.detectFrame();
      };
      
    } catch (err) {
      console.error("No se pudo iniciar la cámara:", err);
      alert("No se pudo iniciar la cámara. Revisa permisos y disponibilidad.");
    }
  }
  function stopCamera() {
    window.detecting = false; // Detener el loop de detección
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    // Eliminar el canvas de las detecciones de video
    $(".preview-wrap canvas").remove();
    $("#fps").text("0"); // Limpiar FPS
    $video.style.display = "none"; // Ocultar el elemento de video
    $video.srcObject = null;
  }

  $("#btnStart").on("click", startCamera);
  $("#btnStop").on("click", stopCamera);

})();
</script>

<script>
// --- Added helper: create a transferable ImageBitmap from various sources
async function makeBitmapFrom(source) {
  // If it's already an ImageBitmap, return it
  if (typeof ImageBitmap !== "undefined" && source instanceof ImageBitmap) return source;

  // If it's a canvas-like or video/image element, we can create an ImageBitmap directly
  if (typeof createImageBitmap === "function") {
    try {
      return await createImageBitmap(source);
    } catch (e) {
      // Fallback: draw to a temporary canvas then createImageBitmap
      try {
        const w = source.videoWidth || source.naturalWidth || source.width;
        const h = source.videoHeight || source.naturalHeight || source.height;
        const tmp = document.createElement("canvas");
        tmp.width = w; tmp.height = h;
        const ctx = tmp.getContext("2d");
        ctx.drawImage(source, 0, 0, w, h);
        return await createImageBitmap(tmp);
      } catch (e2) {
        console.warn("[makeBitmapFrom] createImageBitmap failed; trying ImageData fallback", e2);
      }
    }
  }

  // Ultimate fallback: return null and let caller handle ImageData path
  return null;
}
</script>
