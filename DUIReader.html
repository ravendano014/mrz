    // ========= LOCAL STORAGE HOOK =========
    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.error(error);
          return initialValue;
        }
      });

      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {
          console.error(error);
        }
      };
      
      useEffect(() => {
        const handleStorageChange = (e) => {
            if (e.key === key) {
                try {
                    setStoredValue(e.newValue ? JSON.parse(e.newValue) : initialValue);
                } catch (error) {
                    console.error(error);
                    setStoredValue(initialValue);
                }
            }
        };
        window.addEventListener('storage', handleStorageChange);
        return () => {
            window.removeEventListener('storage', handleStorageChange);
        };
      }, [key]);

      return [storedValue, setValue];

    const fileToGenerativePart = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          if (typeof reader.result === 'string') {
            const [, data] = reader.result.split(',');
            if (data) {
                resolve({ inlineData: { data, mimeType: file.type } });
            } else {
                reject(new Error("Error reading file data."));
            }
          }
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

      const apiKey = 'AIzaSyAN_DJ2M5ECe6g3vQdOUQ0JDngHD_o_1Mw';

      const imagePart = await fileToGenerativePart(file);

          model: 'gemini-2.5-flash',
          contents: { parts: [imagePart, { text: textPrompt }] },
          config: { responseMimeType: "application/json" },

        if (!rawText) {
          throw new Error("La API devolvió una respuesta vacía.");
        }

        const cleanedText = rawText.trim().replace(/^```json\n?/, '').replace(/\n?```$/, '');
        const parsedJson = JSON.parse(cleanedText);

        if (!parsedJson.document_detected) {
            throw new Error("No se pudo detectar un documento de identidad en la imagen.");
