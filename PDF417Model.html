<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Auto PDF417 · Solo modelo pdf417-kl4vz-hl0le</title>

<!-- Dependencias -->
<script src="https://cdn.jsdelivr.net/npm/inferencejs@1.1.3"></script>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>

<style>
  :root{
    --bg:#0b0f14; --panel:#101821; --muted:#131b25; --text:#e6eef7; --sub:#9fb3c8;
    --accent:#5ac8fa; --ok:#34d399; --warn:#fbbf24; --err:#f87171; --border:#1f2a3a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .app{max-width:1100px;margin:auto;padding:14px;display:grid;gap:12px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
  .bar h2{margin:0;color:var(--sub);font-size:1rem}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;background:#0f1720}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .info{color:var(--sub)}
  .spacer{flex:1 1 auto}
  .stage{position:relative; background:#000; border:1px solid var(--border); border-radius:12px; overflow:hidden; min-height:360px}
  .layer{position:absolute; inset:0}
  video, img{width:100%;height:100%;object-fit:contain;background:#000}
  canvas{touch-action:none}
  button,input[type=file]{appearance:none;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);padding:8px 12px;cursor:pointer}
  button.primary{background:linear-gradient(180deg,#132435,#0f1c2a);border-color:#223247}
  button:disabled{opacity:.55;cursor:not-allowed}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
  .card h3{margin:0 0 .5rem;color:var(--sub)}
  textarea{width:100%;height:180px;background:#0a121a;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px;resize:vertical}
  table{width:100%;border-collapse:collapse}
  th,td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
  th{color:var(--sub)}
  .muted{color:#7f8ea2}
  @media (max-width: 980px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">

  <!-- BARRA DE ESTADO (flujo) -->
  <div class="bar" id="statusBar">
    <h2>Estado</h2>
    <span id="stepBadge" class="badge info">Inicializando…</span>
    <div class="spacer"></div>
    <button id="btnNuevo" disabled>Detectar Nuevo PDF417</button>
  </div>

  <!-- CONTROLES DE CÁMARA -->
  <div class="bar">
    <h2>Cámara</h2>
    <button id="btnStart" class="primary">Habilitar cámara</button>
    <button id="btnStop" disabled>Detener</button>
    <div class="spacer"></div>
    <span class="badge" id="fpsBadge">FPS: —</span>
  </div>

  <!-- ESCENARIO -->
  <div class="stage" id="stage">
    <video id="video" class="layer" autoplay muted playsinline></video>
    <img id="preview" class="layer" style="display:none" alt="Vista previa"/>
    <canvas id="overlay" class="layer"></canvas>
  </div>

  <!-- RESULTADOS -->
  <div class="cards">
    <div class="card">
      <h3>Texto crudo (PDF417)</h3>
      <textarea id="raw" placeholder="Aquí se mostrará el texto decodificado…"></textarea>
    </div>
    <div class="card">
      <h3>Datos parseados</h3>
      <div id="parsed">Esperando resultado…</div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="card">
    <h3>Historial de resultados</h3>
    <div class="muted" style="margin-bottom:6px">Se conserva cada lectura exitosa.</div>
    <div id="historyWrap">
      <table>
        <thead><tr><th>#</th><th>Fecha/Hora</th><th>Resumen</th><th>Texto</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
/** =========================
 *  ESTADO GENERAL
 *  ========================= */
const state = {
  engine: null,
  pdfWorkerId: null,
  stream: null,
  running: false,
  activeBitmap: null,
  natural: {w:0,h:0},
  detections: [],
  stableBox: null,
  stableHits: 0,
  lastFpsTs: 0,
  frames: 0,
  history: [],
  zxingReader: null
};

/** =========================
 *  UTILIDADES UI
 *  ========================= */
const $badge = document.getElementById('stepBadge');
function setStep(text, cls='info'){
  $badge.classList.remove('info','ok','warn','err');
  $badge.classList.add(cls);
  $badge.textContent = text;
}

function setButtonsOnRun(on){
  document.getElementById('btnStart').disabled = on;
  document.getElementById('btnStop').disabled  = !on;
}

function drawOverlay(){
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const view = overlay.getBoundingClientRect();
  overlay.width = Math.round(view.width * devicePixelRatio);
  overlay.height= Math.round(view.height* devicePixelRatio);
  overlay.style.width = view.width + 'px';
  overlay.style.height= view.height+ 'px';

  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,overlay.width,overlay.height);

  // Guías de encuadre (tercios)
  const w=view.width, h=view.height;
  ctx.strokeStyle='#223247'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(w/3,0); ctx.lineTo(w/3,h);
  ctx.moveTo(2*w/3,0); ctx.lineTo(2*w/3,h);
  ctx.moveTo(0,h/3); ctx.lineTo(w,h/3);
  ctx.moveTo(0,2*h/3); ctx.lineTo(w,2*h/3);
  ctx.stroke();

  // Dibujar detección del modelo PDF417 (si existe)
  for(const p of state.detections){
    const r = bboxToOverlayRect(p.bbox, view);
    ctx.strokeStyle = '#5ac8fa';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = 'rgba(90,200,250,.1)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#cfe9fb';
    ctx.font = '12px ui-monospace';
    ctx.fillText(`PDF417 ${(p.confidence||0).toFixed(2)}`, r.x+6, r.y+14);
  }
}

function bboxToOverlayRect(bbox, view){
  const vw = view.width, vh = view.height;
  const natW = state.natural.w||1, natH = state.natural.h||1;
  const scale = Math.min(vw/natW, vh/natH);
  const offX = (vw - natW*scale)/2, offY = (vh - natH*scale)/2;
  const x = offX + (bbox.x - bbox.width/2) * scale;
  const y = offY + (bbox.y - bbox.height/2) * scale;
  const w = bbox.width * scale;
  const h = bbox.height * scale;
  return {x,y,w,h};
}

function mapOverlayRectToNatural(r, view){
  const vw = view.width, vh = view.height;
  const natW = state.natural.w, natH = state.natural.h;
  const scale = Math.min(vw/natW, vh/natH);
  const contentW = natW*scale, contentH = natH*scale;
  const offX = (vw - contentW)/2, offY = (vh - contentH)/2;

  const ox = r.x, oy = r.y, ow = r.w, oh = r.h;
  const nx = Math.round((ox - offX)/scale);
  const ny = Math.round((oy - offY)/scale);
  const nw = Math.round(ow/scale);
  const nh = Math.round(oh/scale);

  const x = Math.max(0, Math.min(natW, nx));
  const y = Math.max(0, Math.min(natH, ny));
  const w = Math.max(1, Math.min(natW - x, nw));
  const h = Math.max(1, Math.min(natH - y, nh));
  return {x,y,w,h};
}

/** =========================
 *  INICIALIZACIÓN (SOLO MODELO PDF417)
 *  ========================= */
async function initModels(){
  try{
    setStep('Importante y crítico: cargando motor…','info');
    state.engine = new inferencejs.InferenceEngine();

    // SOLO modelo PDF417 para localizar el código de barras
    setStep('Cargando modelo PDF417 (pdf417-kl4vz-hl0le)…','info');
    state.pdfWorkerId = await state.engine.startWorker(
      'pdf417-kl4vz-hl0le','1',
      'rf_hHUmNcZwoGhdPO3kyAlI6YY4R4m2' // token demo
    );

    // ZXing para decodificar
    state.zxingReader = new ZXing.BrowserMultiFormatReader();

    setStep('Modelo listo. Posteriormente habilita la cámara…','ok');
  }catch(e){
    console.error(e);
    setStep('Error cargando el modelo','err');
    throw e;
  }
}

/** =========================
 *  CÁMARA + BUCLE
 *  ========================= */
async function startCamera(){
  try{
    setStep('Habilitando cámara…','info');
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { exact: 'environment' },
        width: { ideal: 1920 }, height: { ideal: 1080 },
        frameRate: { ideal: 30, max: 30 }
      },
      audio: false
    });
  }catch(_){
    // fallback si no hay cámara trasera exact
    state.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
  }

  const video = document.getElementById('video');
  video.srcObject = state.stream;
  await video.play();
  state.running = true;
  setButtonsOnRun(true);

  // Mostrar video, ocultar preview
  document.getElementById('preview').style.display='none';
  video.style.display='block';

  // Medidas naturales
  state.natural = {w: video.videoWidth, h: video.videoHeight};
  drawOverlay();

  setStep('Detecta el PDF417 (encuadra dentro del marco)…','info');
  requestAnimationFrame(loop);
}

function stopCamera(){
  state.running=false;
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
  setButtonsOnRun(false);
}

/** Localizar PDF417 en vivo + estabilidad + captura + decodificar */
async function loop(ts){
  if(!state.running) return;

  // FPS
  state.frames++;
  if(ts - state.lastFpsTs > 1000){
    const fps = Math.round(state.frames * 1000 / (ts - state.lastFpsTs));
    document.getElementById('fpsBadge').textContent = 'FPS: ' + fps;
    state.frames=0; state.lastFpsTs=ts;
  }

  const video = document.getElementById('video');
  if(!video.videoWidth){ requestAnimationFrame(loop); return; }

  // Bitmap base
  const bmp = await createImageBitmap(video);
  state.activeBitmap = bmp;
  state.natural = {w:bmp.width,h:bmp.height};

  // Inferencia SOLO con el modelo de PDF417
  try{
    const preds = await state.engine.infer(state.pdfWorkerId, new inferencejs.CVImage(video));
    state.detections = preds || [];
    drawOverlay();

    // Tomar la mejor predicción
    const best = _.maxBy(state.detections, p => p.confidence || 0);
    if(best && (best.confidence||0) >= 0.68){
      if(boxStable(best.bbox, state.stableBox, state.natural)){
        state.stableHits++;
      }else{
        state.stableBox = _.cloneDeep(best.bbox);
        state.stableHits = 1;
      }

      if(state.stableHits >= 3){
        state.stableHits = 0;
        await captureFromDetection(best);
        return; // continúa en captureFromDetection
      }
    }
  }catch(e){
    console.warn('infer pdf417', e);
  }

  requestAnimationFrame(loop);
}

function boxStable(b1, b2, nat){
  if(!b1 || !b2) return false;
  const epsPos = 0.03, epsSize=0.06;
  return Math.abs(b1.x-b2.x) <= nat.w*epsPos &&
         Math.abs(b1.y-b2.y) <= nat.h*epsPos &&
         Math.abs(b1.width -b2.width ) <= nat.w*epsSize &&
         Math.abs(b1.height-b2.height) <= nat.h*epsSize;
}

async function captureFromDetection(det){
  setStep('Captura la vista previa…','info');

  const {w:W,h:H} = state.natural;
  const {x,y,width,height} = det.bbox;
  const x0 = Math.max(0, Math.round(x - width/2));
  const y0 = Math.max(0, Math.round(y - height/2));
  const ww = Math.min(W - x0, Math.round(width));
  const hh = Math.min(H - y0, Math.round(height));

  // Recorte
  const off = new OffscreenCanvas(ww, hh);
  const g = off.getContext('2d');
  g.drawImage(state.activeBitmap, x0,y0,ww,hh, 0,0,ww,hh);

  // Mostrar como vista previa (pausar cámara durante lectura)
  const blob = await off.convertToBlob({type:'image/png',quality:0.92});
  const url = URL.createObjectURL(blob);
  const $prev = document.getElementById('preview');
  await new Promise(res=>{
    $prev.onload = res;
    $prev.src = url;
  });
  URL.revokeObjectURL(url);

  // Cambiar a imagen fija
  document.getElementById('video').style.display='none';
  $prev.style.display='block';
  stopCamera();

  // Guardar bitmap activo desde preview para ZXing
  const bmp = await createImageBitmap($prev);
  state.activeBitmap = bmp;
  state.natural = {w:bmp.width,h:bmp.height};

  // Decodificar
  setStep('Extrae el texto crudo…','info');
  const raw = await decodeWithZXing(off);
  if(!raw){
    setStep('PDF417 detectado pero no decodificado. Ajusta enfoque/iluminación.','warn');
    return;
  }

  document.getElementById('raw').value = raw.trim();
  setStep('Parsea datos a la tabla…','info');
  const parsed = parsePDF417(raw.trim());
  renderParsed(parsed);

  // Historial
  pushHistory(raw.trim(), parsed);

  // Final
  setStep('Listo ✅ Datos mostrados. Activa “Detectar Nuevo PDF417” para repetir desde el paso 2.','ok');
  document.getElementById('btnNuevo').disabled = false;
}

/** =========================
 *  ZXing decode helper
 *  ========================= */
async function decodeWithZXing(offscreenCanvas){
  const blob = await offscreenCanvas.convertToBlob({type:'image/png', quality:0.95});
  const url = URL.createObjectURL(blob);
  try{
    const result = await state.zxingReader.decodeFromImageUrl(url).catch(()=>null);
    if(!result) return '';
    return (result.getText ? result.getText() : result.text) || '';
  }finally{
    URL.revokeObjectURL(url);
  }
}

/** =========================
 *  PARSEO BÁSICO DE PDF417 (DUI-friendly / genérico)
 *  ========================= */
function parsePDF417(raw){
  const result = {};
  const dui = raw.match(/\b(\d{8}-\d)\b/);
  if(dui){ result['DUI'] = dui[1]; }

  const nacimiento = raw.match(/\b(19|20)\d{2}[-/](0[1-9]|1[0-2])[-/](0[1-9]|[12]\d|3[01])\b/);
  if(nacimiento){ result['Fecha de nacimiento'] = nacimiento[0].replace(/\//g,'-'); }

  const sexo = raw.match(/\b(Sexo|SEXO)\s*[:=]?\s*([MF])\b/);
  if(sexo){ result['Sexo'] = sexo[2]; }

  const kv = {};
  raw.split(/\r?\n+/).forEach(line=>{
    const m = line.match(/^([^:]{2,48})\s*:\s*(.+)$/);
    if(m){ kv[m[1].trim()] = m[2].trim(); }
  });

  if(Object.keys(kv).length){
    Object.assign(result, kv);
  }else{
    const lines = raw.split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
    lines.forEach((v,i)=>{ result['Línea '+(i+1)] = v; });
  }
  return result;
}

function renderParsed(obj){
  const el = document.getElementById('parsed');
  let html = '<table><thead><tr><th>Campo</th><th>Valor</th></tr></thead><tbody>';
  for (const [k,v] of Object.entries(obj)){
    const val = (v==null || v==='') ? '<span class="muted">—</span>' : escapeHtml(String(v));
    html += `<tr><td><strong>${escapeHtml(k)}</strong></td><td>${val}</td></tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

function pushHistory(raw, parsed){
  const body = document.getElementById('historyBody');
  state.history.push({ts:new Date(), raw, parsed});
  const i = state.history.length;
  const summary = parsed['DUI'] ? `DUI: ${escapeHtml(parsed['DUI'])}` :
                  Object.keys(parsed)[0] ? `${escapeHtml(Object.keys(parsed)[0])}: ${escapeHtml(String(parsed[Object.keys(parsed)[0]])).slice(0,40)}…` :
                  '(sin campos)';
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${i}</td><td>${state.history[i-1].ts.toLocaleString()}</td><td>${summary}</td><td><pre style="white-space:pre-wrap;margin:0">${escapeHtml(raw).slice(0,240)}${raw.length>240?'…':''}</pre></td>`;
  body.prepend(tr);
}

/** =========================
 *  “DETECTAR NUEVO PDF417”
 *  ========================= */
function resetCycleToStep2(){
  document.getElementById('raw').value = '';
  document.getElementById('parsed').innerHTML = 'Esperando resultado…';
  state.detections = [];
  state.stableBox = null; state.stableHits = 0;
  drawOverlay();

  // Vista previa -> cámara
  document.getElementById('preview').style.display='none';
  document.getElementById('video').style.display='block';

  document.getElementById('btnNuevo').disabled = true;
  setStep('Posteriormente habilita la cámara…','info');
  startCamera();
}

/** =========================
 *  HELPERS + WIRE-UP
 *  ========================= */
function escapeHtml(s){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

window.addEventListener('resize', drawOverlay);

document.getElementById('btnStart').addEventListener('click', startCamera);
document.getElementById('btnStop').addEventListener('click', ()=>{
  stopCamera();
  setStep('Cámara detenida. Pulsa “Habilitar cámara” para continuar.','warn');
});
document.getElementById('btnNuevo').addEventListener('click', resetCycleToStep2);

// Inicializa SOLO el modelo PDF417 y deja todo listo
(async ()=>{
  await initModels();
  try{ await startCamera(); }catch{ /* algunos navegadores requieren gesto del usuario */ }
})();
</script>
</body>
</html>
